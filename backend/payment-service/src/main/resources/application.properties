spring.application.name=payment-service

# WildFly occupies 8080, Apache httpd occupies 8081, auth-service occupies 8082,
# ecommerce-service occupies 8083 in this environment
server.port=8084

# Same Northwind SQL Server instance used by the other services in Phase 1. Payments
# itself is new - not part of the original Northwind schema - so unlike Accounts here
# this table has no legacy monolith code to stay compatible with.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NorthWind;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema already exists (Northwind) - never let Hibernate alter it. The Payments table
# itself must be created once via a migration script, same as the rest of this schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Use explicit @Column(name=...) values as-is (Spring's default naming strategy
# would otherwise rewrite "OrderID" to "order_id" and break the Northwind schema)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# HS256 signing key - only used to VERIFY tokens here (this service never issues them).
# Must be identical to auth-service's app.jwt.secret. Override via JWT_SECRET env var
# in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-to-a-random-32-byte-value-minimum}
app.jwt.expiration-ms=86400000
