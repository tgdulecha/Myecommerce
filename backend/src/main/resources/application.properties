spring.application.name=myapp-springboot

# WildFly occupies 8080 and Apache httpd occupies 8081 in this environment
server.port=8085

# Same Northwind SQL Server instance used by the original MyAppDataLayer/DataSourceFactory
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NorthWind;encrypt=false;trustServerCertificate=true
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=corso7
spring.datasource.password=corso7
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema already exists (Northwind) - never let Hibernate alter it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Use explicit @Column(name=...) values as-is (Spring's default naming strategy
# would otherwise rewrite "ProductName" to "product_name" and break the Northwind schema)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
