# Overrides only the datasource - everything else (credentials env vars, driver,
# ddl-auto=none, naming strategy, JWT secret/expiration) is inherited from
# application.properties. Points integration tests at the disposable schema
# created by src/test/resources/sql/northwind_clone_schema.sql instead of the
# real NorthWind database.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NorthWind_clone;encrypt=false;trustServerCertificate=true
